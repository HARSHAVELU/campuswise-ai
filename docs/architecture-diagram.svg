<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>
  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">CampusWise AI — System Architecture</text>

  <!-- Client group -->
  <g>
    <rect x="40" y="90" width="220" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="150" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">CLIENT</text>
    <rect x="60" y="130" width="180" height="60" rx="8" fill="#ffffff" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="150" y="165" text-anchor="middle" font-size="14" fill="#0f172a">Next.js Frontend</text>
  </g>

  <!-- API group -->
  <g>
    <rect x="340" y="90" width="480" height="340" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="580" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#15803d">FASTAPI BACKEND</text>

    <rect x="365" y="140" width="200" height="60" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <text x="465" y="175" text-anchor="middle" font-size="14" fill="#0f172a">REST API Layer</text>

    <rect x="595" y="140" width="200" height="60" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <text x="695" y="167" text-anchor="middle" font-size="13" fill="#0f172a">LangGraph Agent</text>
    <text x="695" y="184" text-anchor="middle" font-size="13" fill="#0f172a">Orchestration</text>

    <rect x="365" y="230" width="430" height="70" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <text x="580" y="258" text-anchor="middle" font-size="13" fill="#0f172a">Services</text>
    <text x="580" y="278" text-anchor="middle" font-size="12" fill="#475569">ranking · optimization · analytics · degree planning</text>

    <rect x="365" y="330" width="430" height="60" rx="8" fill="#ffffff" stroke="#4ade80" stroke-width="1.5"/>
    <text x="580" y="365" text-anchor="middle" font-size="14" fill="#0f172a">Repositories</text>
  </g>

  <!-- Data group -->
  <g>
    <rect x="900" y="90" width="460" height="340" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="1130" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#b91c1c">DATA LAYER</text>

    <ellipse cx="1000" cy="200" rx="95" ry="45" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="1000" y="197" text-anchor="middle" font-size="13" fill="#0f172a">PostgreSQL</text>
    <text x="1000" y="214" text-anchor="middle" font-size="11" fill="#475569">(core schema)</text>

    <ellipse cx="1260" cy="200" rx="95" ry="45" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="1260" y="205" text-anchor="middle" font-size="13" fill="#0f172a">Redis Cache</text>

    <ellipse cx="1130" cy="330" rx="140" ry="50" fill="#ffffff" stroke="#f87171" stroke-width="1.5"/>
    <text x="1130" y="326" text-anchor="middle" font-size="13" fill="#0f172a">pgvector</text>
    <text x="1130" y="344" text-anchor="middle" font-size="11" fill="#475569">(syllabus / semantic search)</text>
  </g>

  <!-- Ingestion group -->
  <g>
    <rect x="340" y="480" width="580" height="140" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="2"/>
    <text x="630" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">INGESTION</text>

    <rect x="365" y="525" width="230" height="65" rx="8" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="480" y="562" text-anchor="middle" font-size="14" fill="#0f172a">Ingestion Pipelines</text>

    <ellipse cx="800" cy="558" rx="90" ry="42" fill="#ffffff" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="800" y="563" text-anchor="middle" font-size="13" fill="#0f172a">Raw Storage</text>
  </g>

  <!-- Guardrail note -->
  <g>
    <rect x="40" y="480" width="260" height="140" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="170" y="505" text-anchor="middle" font-size="13" font-weight="700" fill="#6d28d9">GUARDRAIL</text>
    <text x="60" y="535" font-size="12" fill="#334155">LLM is confined to two jobs:</text>
    <text x="60" y="558" font-size="12" fill="#334155">1. NL → structured constraints</text>
    <text x="60" y="580" font-size="12" fill="#334155">2. Verified facts → explanation</text>
    <text x="60" y="605" font-size="12" fill="#334155">Everything else is deterministic code.</text>
  </g>

  <!-- Arrows -->
  <!-- FE <-> REST -->
  <line x1="260" y1="160" x2="360" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- REST -> AGENTS -->
  <line x1="565" y1="170" x2="592" y2="170" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- REST -> SVC -->
  <path d="M465,200 L465,230" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- AGENTS -> SVC -->
  <path d="M695,200 L695,230" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- SVC -> REPO -->
  <line x1="580" y1="300" x2="580" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- REPO -> PG -->
  <path d="M797,355 C 870,355 900,270 995,225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- SVC -> REDIS -->
  <path d="M797,265 C 950,265 1150,235 1240,225" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- AGENTS -> VEC -->
  <path d="M797,185 C 1050,185 1200,240 1170,290" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-accent)"/>

  <!-- ING -> RAW -->
  <line x1="595" y1="558" x2="705" y2="558" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RAW -> PG -->
  <path d="M850,530 C 950,450 980,320 1000,245" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- ING -> VEC -->
  <path d="M900,545 C 1000,500 1080,420 1120,380" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow-accent)"/>

  <!-- Legend -->
  <g transform="translate(40,700)">
    <rect x="0" y="0" width="1320" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="28" font-size="14" font-weight="700" fill="#0f172a">Legend</text>
    <line x1="20" y1="50" x2="60" y2="50" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="70" y="55" font-size="12" fill="#334155">Deterministic call / data flow</text>
    <line x1="330" y1="50" x2="370" y2="50" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-accent)"/>
    <text x="380" y="55" font-size="12" fill="#334155">Vector / semantic retrieval path</text>
    <text x="20" y="85" font-size="12" fill="#334155">Client → REST → (Agents + Services) → Repositories → PostgreSQL / Redis / pgvector</text>
    <text x="20" y="108" font-size="12" fill="#334155">Ingestion pipelines write raw source data into PostgreSQL and embeddings into pgvector, independent of live request traffic.</text>
    <text x="20" y="131" font-size="12" fill="#334155">See docs/architecture-proposal.md for the full product, AI, database, and API architecture.</text>
  </g>
</svg>
