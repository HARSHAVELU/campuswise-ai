# Alertmanager routes and de-duplicates alerts fired by Prometheus's rules
# (infrastructure/prometheus/alert_rules.yml). By default this ships with a
# receiver that has no external integrations configured -- alerts still
# fire, de-duplicate, and are visible/queryable at http://localhost:9093,
# but nothing pages a human until you plug in real credentials below.
#
# To actually get paged, uncomment and fill in ONE of the receivers below
# with your own webhook URL / SMTP credentials, then point `route.receiver`
# (or a specific route) at it.

global:
  resolve_timeout: 5m

route:
  receiver: "default"
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "default"
      repeat_interval: 1h

receivers:
  - name: "default"
    # No integrations configured -- alerts are visible in the Alertmanager
    # UI/API but nothing is pushed externally. This is intentional: this
    # project has no real Slack workspace, email relay, or PagerDuty
    # account to send to, and fabricating one would be worse than being
    # explicit that delivery isn't wired up yet.

  # Example: uncomment and set a real Slack incoming-webhook URL to get
  # alerts posted to a channel.
  # - name: "slack"
  #   slack_configs:
  #     - api_url: "https://hooks.slack.com/services/REPLACE/WITH/REAL_WEBHOOK"
  #       channel: "#campuswise-alerts"
  #       send_resolved: true

  # Example: uncomment and set real SMTP credentials to get alerts emailed.
  # - name: "email"
  #   email_configs:
  #     - to: "oncall@example.edu"
  #       from: "alertmanager@example.edu"
  #       smarthost: "smtp.example.edu:587"
  #       auth_username: "alertmanager@example.edu"
  #       auth_password: "REPLACE_WITH_REAL_PASSWORD"
  #       send_resolved: true
