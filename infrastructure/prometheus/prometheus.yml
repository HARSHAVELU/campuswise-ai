global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: campuswise-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: redis
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
